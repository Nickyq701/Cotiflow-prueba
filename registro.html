<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTIFLOW - Crear cuenta</title>
<!-- Lucide Icons Este sirve para poner el icono al lado del titulo de Cotiflow -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- Estilos CSS -->
<link rel="stylesheet" href="../css/EstiloRegistro.css">
</head>
<body>

<div class="register-card">
    
    <!-- LADO IZQUIERDO (Branding azul oscuro) -->
    <div class="card-left">
    <div class="brand-header">
        <div class="icon-badge">
        <i data-lucide="file-text"></i>
        </div>
        <h1 class="brand-title">COTIFLOW</h1>
        <p class="brand-subtitle">Sistema de Cotización e Inventario</p>
    </div>

    <div class="brand-footer">
        <h2 class="hero-headline">
        Con tus Cotizaciones claras,<br>
        mantienes tu Inventario bajo control.
        </h2>
        <p class="hero-description">
        Gestiona solicitudes, productos y cotizaciones desde un solo lugar.
        </p>
    </div>
    </div>

    <!-- LADO DERECHO (Formulario de Registro) -->
    <div class="card-right">
    <div class="form-header">
        <div class="lock-icon-badge">
        <i data-lucide="lock"></i>
        </div>
        <h2 class="form-title">Crear cuenta</h2>
        <p class="form-subtitle">Regístrate como cliente para comenzar.</p>
    </div>

    <form class="register-form">
        <!-- Nombre completo -->
        <div class="form-group">
        <label for="fullname">Nombre completo</label>
        <input type="text" id="fullname" placeholder="Tu nombre completo" required>
        </div>

        <!-- Tipo de documento -->
        <div class="form-group">
        <label for="doc-type">Tipo de documento</label>
        <div class="select-wrapper">
            <select id="doc-type">
            <option value="CC" selected>Cédula de ciudadanía (CC)</option>
            <option value="CE">Cédula de extranjería (CE)</option>
            <option value="NIT">NIT</option>
            <option value="PASAPORTE">Pasaporte</option>
            </select>
        </div>
        </div>

        <!-- Número de documento -->
        <div class="form-group">
        <label for="doc-number">Número de documento</label>
        <input type="text" id="doc-number" placeholder="Número de identificación" required>
        </div>
<!-- Dirección de residencia o empresa -->
        <div class="form-group">
        <label for="address">Dirección de residencia o empresa</label>
        <input type="text" id="address" placeholder="Dirección completa" required>
        </div>

        <!-- Correo electrónico -->
        <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="" required>
        </div>

        <!-- Confirmar contraseña -->
        <div class="form-group">
          <label for="confirm-password">Confirmar contraseña</label>
          <input type="password" id="confirm-password" placeholder="" required>
        </div>

        <!-- Botón submit -->
        <button type="submit" class="btn-submit">
          Crear cuenta
        </button>
      </form>

      <div class="form-footer">
        <span>¿Ya tienes cuenta?</span>
        <a href="../index.html">Inicia sesión</a>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
