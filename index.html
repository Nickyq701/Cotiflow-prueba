<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTIFLOW - Iniciar sesión</title>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- Archivo CSS -->
<link rel="stylesheet" href="./css/Estilo.css">
</head>
<body>

<!-- Contenedor principal centrado -->
<div class="login-card">
    
    <!-- Sección Izquierda (Branding / Banner) -->
    <div class="card-left">
        <div class="brand-header">
        <div class="icon-badge">
            <i data-lucide="file-text"></i>
        </div>
        <h1 class="brand-title">COTIFLOW</h1>
        <p class="brand-subtitle">Sistema de Cotización e Inventario</p>
    </div>

    <div class="brand-footer">
        <h2 class="hero-headline">
        Con tus Cotizaciones claras,<br>
        mantienes tu Inventario bajo control.
        </h2>
        <p class="hero-description">
        Gestiona solicitudes, productos y cotizaciones desde un solo lugar.
        </p>
    </div>
    </div>

    <!-- Sección Derecha (Formulario) -->
    <div class="card-right">
    <div class="form-header">
        <div class="lock-icon-badge">
        <i data-lucide="lock"></i>
        </div>
        <h2 class="form-title">Iniciar sesión</h2>
        <p class="form-subtitle">Ingresa con tu cuenta autorizada.</p>
    </div>

    <form class="login-form">
        <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="" required>
        </div>

        <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="" required>
        </div>

        <button type="submit" class="btn-submit">Entrar al sistema <i data-lucide="arrow-right"></i></button>
    </form>

    <div class="form-footer">
        <span>¿Eres nuevo en COTIFLOW?</span>
        <a href="./html/registro.html">Registrarse</a>
    </div>
    </div>

</div>

<!-- Inicialización de los íconos de Lucide -->
<script>
    lucide.createIcons();
</script>
</body>
</html>
